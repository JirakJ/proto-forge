{{- if eq .Values.expose.kind "ingress" }}
# Rendered only when expose.kind is "ingress" (generic/AKS clusters — an
# OpenShift environment uses a Route; deploy:verify cross-checks the pairing).
# HSTS belongs to the TLS edge: set it on the ingress controller (its config or
# per-controller annotation), not in the pod — no local server speaks TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if and .Values.expose.tlsSecret .Values.expose.host }}
  tls:
    - hosts:
        - {{ .Values.expose.host | quote }}
      secretName: {{ .Values.expose.tlsSecret }}
  {{- end }}
  rules:
    {{- if .Values.expose.host }}
    - host: {{ .Values.expose.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.fullname" . }}
                port:
                  name: http
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.fullname" . }}
                port:
                  name: http
    {{- end }}
{{- end }}
