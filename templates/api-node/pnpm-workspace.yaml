# Dev-only transitives flagged by osv-scanner (pnpm audit --prod does not see them).
# Each pin is the first patched release in the range every dependent already accepts.
# handlebars <4.7.9 carries the JS-injection advisory batch (GHSA-2w6w-674q-4c4q et
# al.), pulled via eslint-plugin-boundaries@5; qs GHSA-q8mj-m7cp-5q26 via
# @stryker-mutator/core → typed-rest-client; js-yaml GHSA-5p4m-2wfm-xmqj (HIGH,
# prototype pollution) via eslint/jscpd config parsing; nanoid GHSA-2v37-7h3g-55p8
# (HIGH, predictable ids); brace-expansion GHSA-rgw5-rvv9-x895 (ReDoS); esbuild
# GHSA-g7r4-m6w7-qqqr (LOW, dev-server file read on Windows) via tsx.
overrides:
  zod: ^4.6.6
  handlebars: 4.7.10
  # 6.16.0 additionally closes GHSA-4mjr-xmp4-gh2g (MODERATE, DoS via an
  # attacker-controlled isBuffer) and GHSA-x5fp-wj9c-mxmx (MODERATE, array-limit
  # bypass via bracket-key comma parsing).
  # 6.16.1 closes GHSA-6pq8-jhm2-2vcw (MODERATE, uncaught TypeError in stringify
  # with arrayFormat "comma").
  qs: ">=6.16.1"
  # fast-uri <3.1.6 / <4.1.3 carries four HIGH advisories: host confusion via
  # percent-encoded scheme normalization (GHSA-jqff-g426-hqxp) and via skipped IDN
  # canonicalization on scheme-relative references (GHSA-5jgf-p345-68v8), plus SSRF
  # via malformed IPv6 normalization (GHSA-f65p-4m7j-42xc) and repeated hostname
  # percent-decoding (GHSA-fph4-wmhf-6fwf). Dev-only, pulled through ajv@8.
  fast-uri@3: ^3.1.9
  fast-uri@4: ^4.2.3
  # 4.3.2 also closes GHSA-2883-xcg3-v3hh (HIGH, maxTotalMergeKeys does not limit
  # CPU use for empty merge sources).
  js-yaml: ^4.3.2
  nanoid: ^3.3.17
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  esbuild: ">=0.28.1"
  brace-expansion@5: ^5.0.12
  braces: file:vendor/braces-3.0.4-security.1.tgz

  # Security fixes for existing transitives; local sprintf fork includes tests.
  source-map-js: 1.2.2
