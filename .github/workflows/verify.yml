name: verify

on:
  # `main` only. A push to any OTHER branch is already covered by that branch's
  # pull request, and matching "**" here meant every push to a branch with an
  # open PR fired the whole workflow TWICE — once as `push`, once as
  # `pull_request` — so every check appeared twice from two different run ids
  # and the matrix ran 24 jobs where 12 were asked for. Under the
  # branch-per-unit rule (ADR 010) nothing reaches main except through a pull
  # request, so this loses no coverage: the PR run is the one that gates.
  push:
    branches: [main]
  pull_request:
  # Re-run on demand. Without this the only way to re-verify a commit is to push
  # another one: a run killed mid-flight — by disabling the workflow, by a
  # runner dying — cannot be restarted, and `gh run rerun` on it silently does
  # nothing. That happened, and main sat red with no way to ask again.
  workflow_dispatch:

# A second push while the first run is still going supersedes it. The older run
# can only tell you about bytes nobody is proposing any more.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Two kinds of jobs, deliberately separate: a plugin failure and a template failure
# have different causes and different fixes, and one combined red X hides which
# happened. The template job is a matrix DERIVED from references/templates.json
# (ADR 007) — a hand-maintained mirror of the registry is exactly the drift that
# let three backend templates ship without their deploy toolchain, so the list,
# the per-stack setup and the tool installs all read the registry or the tree.
# WHERE THIS RUNS. `runs-on` reads the repository variable RUNNER_LABEL and falls
# back to `ubuntu-latest`, so moving the whole suite onto a self-hosted machine is a
# settings change rather than a commit: register the runner, then set RUNNER_LABEL to
# a label it carries (`self-hosted`, or something narrower like `rpi`). Unset, nothing
# changes. The fallback matters — a hardcoded `self-hosted` queues every job forever
# the moment the runner is offline, and a queued job is indistinguishable from a slow
# one until someone goes looking.
#
# Two things a self-hosted arm64 runner needs that a GitHub one does not: the tool
# installs below pick their asset from `uname -m` (an x64 binary on arm64 installs
# happily and then cannot execute), and the box needs passwordless sudo for those
# `sudo tar`/`sudo curl` steps and for the apt packages the tauri leg installs.
# Expect the mutation legs to dominate the wall clock on small hardware: the web
# template's Stryker run alone is over an hour on a laptop.

jobs:
  plugin:
    name: plugin gates
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          # The root pin, not a template's: a template Node bump must not silently
          # change the runtime the plugin gates run on.
          node-version-file: .nvmrc
      - name: selftest the gates
        run: node scripts/selftest-all.mjs
      - name: verify
        # `pnpm run verify` rather than a copied chain: the chain lives in
        # package.json, and a second copy of it here would drift the way the
        # template matrix did.
        run: pnpm run verify

  plan:
    name: template matrix
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      templates: ${{ steps.registry.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - name: read the template registry
        id: registry
        run: |
          list="$(node -e "console.log(JSON.stringify(require('./references/templates.json').templates.map((t) => ({ id: t.id, kind: t.kind, stack: t.stack }))))")"
          printf 'templates=%s\n' "$list" >> "$GITHUB_OUTPUT"
          printf 'registered templates: %s\n' "$list"

  template:
    name: "template verify (${{ matrix.template.id }})"
    needs: plan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.plan.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: templates/${{ matrix.template.id }}/.nvmrc
          cache: pnpm
          cache-dependency-path: templates/${{ matrix.template.id }}/pnpm-lock.yaml
      - name: install osv-scanner
        # Where a stack's audit is not `pnpm audit` (JVM and NuGet lockfiles are not),
        # sec:scan hard-stops in CI without osv-scanner (BRS §16). The condition asks
        # the template's own gate what it needs instead of trusting a list here.
        env:
          TEMPLATE: ${{ matrix.template.id }}
        run: |
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            x86_64|amd64)  ARCH=amd64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          if grep -q "osv-scanner" "templates/${TEMPLATE}/scripts/sec-scan.mjs"; then
            sudo curl -sSfL -o /usr/local/bin/osv-scanner \
              "https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_${ARCH}"
            sudo chmod +x /usr/local/bin/osv-scanner
          else
            echo "this template's sec:scan does not use osv-scanner"
          fi
      - name: set up JDK
        if: contains(fromJson('["java", "kotlin"]'), matrix.template.stack)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: set up uv
        if: matrix.template.stack == 'python'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: set up .NET
        if: matrix.template.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: templates/${{ matrix.template.id }}/global.json
      - name: set up Rust and the GTK shell libraries
        # shell:verify's tool half (`cargo check --locked`) is mandatory in CI, and
        # tauri's linux build needs webkit2gtk. Keyed on the tree — a template with
        # no src-tauri asks for none of this.
        if: hashFiles(format('templates/{0}/src-tauri/Cargo.toml', matrix.template.id)) != ''
        # The compiler version is the template's `src-tauri/rust-toolchain.toml`
        # (NFR-11): read here, never repeated here.
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "templates/${{ matrix.template.id }}/src-tauri/rust-toolchain.toml")"
          test -n "$CHANNEL" || { echo "::error::src-tauri/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$CHANNEL" --profile minimal --no-self-update
          rustup default "$CHANNEL"
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: install the deploy toolchain
        # deploy:verify hard-fails in CI when its tools are absent (NFR-16), so every
        # template that SHIPS the gate needs them — the condition reads the tree, not a
        # list someone remembers to extend. docker and helm ship on ubuntu-latest.
        if: hashFiles(format('templates/{0}/scripts/deploy-verify.mjs', matrix.template.id)) != ''
        # Same rule as the scanner installs above: the asset follows `uname -m`.
        run: |
          case "$(uname -m)" in
            aarch64|arm64) KUBECONFORM_ARCH=arm64; HADOLINT_ARCH=arm64 ;;
            x86_64|amd64)  KUBECONFORM_ARCH=amd64; HADOLINT_ARCH=x86_64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-${HADOLINT_ARCH}"
          sudo chmod +x /usr/local/bin/hadolint
      - name: install
        # Warms the pnpm store and the browser cache the scratch copy will reuse;
        # node_modules itself is excluded from the copy.
        working-directory: templates/${{ matrix.template.id }}
        run: pnpm install --frozen-lockfile
      - name: install browsers
        # The kinds whose verify chain drives a browser. The e2e template ships a
        # playwright config too, but its suite runs against a live pair in the
        # workspace CI, never inside verify (§23).
        if: matrix.template.kind == 'frontend' || matrix.template.kind == 'desktop'
        working-directory: templates/${{ matrix.template.id }}
        run: pnpm exec playwright install --with-deps chromium
      - name: verify the shipped template in isolation
        # Copies the template to a scratch dir, installs there and runs its own
        # verify — the standalone proof: the tree we ship works outside this repository.
        run: node scripts/verify-template.mjs --template ${{ matrix.template.id }}
      - name: upload playwright report
        if: failure() && (matrix.template.kind == 'frontend' || matrix.template.kind == 'desktop')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.template.id }}
          path: .scratch/verify-${{ matrix.template.id }}/playwright-report/
          retention-days: 7
