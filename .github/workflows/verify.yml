name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# Two kinds of jobs, deliberately separate: a plugin failure and a template failure
# have different causes and different fixes, and one combined red X hides which
# happened. The template job is a matrix over references/templates.json — one leg
# per template, so an api-java failure never masks a web success (ADR 007).
jobs:
  plugin:
    name: plugin gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: templates/web/.nvmrc
      - name: selftest the gates
        run: node scripts/selftest-all.mjs
      - name: verify
        run: node scripts/citations.mjs && node scripts/skill-lint.mjs && node scripts/manifest-lint.mjs && node scripts/template-integrity.mjs

  template:
    name: "template verify (${{ matrix.template }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with references/templates.json — the registry is the source;
        # this list is its CI mirror (a drifted entry fails verify-template itself).
        template: [web, api-node, workspace, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: templates/${{ matrix.template }}/.nvmrc
          cache: pnpm
          cache-dependency-path: templates/${{ matrix.template }}/pnpm-lock.yaml
      - name: install gitleaks
        # sec:scan hard-stops in CI when gitleaks is absent (NFR-08, BRS §4). A pinned
        # binary install is what makes that hard-stop meaningful rather than a permanent
        # failure — gitleaks-action is a scanner wrapper, not an installer.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: install
        # Warms the pnpm store and the Playwright browser cache the scratch copy will
        # reuse; node_modules itself is excluded from the copy.
        working-directory: templates/${{ matrix.template }}
        run: pnpm install --frozen-lockfile
      - name: install browsers
        if: matrix.template == 'web'
        working-directory: templates/${{ matrix.template }}
        run: pnpm exec playwright install --with-deps chromium
      - name: verify the shipped template in isolation
        # Copies the template to a scratch dir, installs there and runs its own
        # verify — the standalone proof: the tree we ship works outside this repository.
        run: node scripts/verify-template.mjs --template ${{ matrix.template }}
      - name: upload playwright report
        if: failure() && matrix.template == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.template }}
          path: .scratch/verify-${{ matrix.template }}/playwright-report/
          retention-days: 7
