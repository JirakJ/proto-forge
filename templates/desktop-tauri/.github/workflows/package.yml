name: package

# ADR 203 / NFR-16: packaging is a CI STAGE, never a gate — `pnpm verify` proves
# the committed shell configuration offline (shell:verify), and THIS workflow is
# the only place installers are built. One green verify per commit feeds one
# packaging run per OS; nothing here re-tests, nothing here deploys.
#
# Signing posture (docs/DELIVERY.md): this workflow holds NO signing secrets and
# produces UNSIGNED artifacts on purpose. Developer ID + notarization (macOS),
# Authenticode (Windows) and repo signing (Linux) are release-channel concerns a
# real product wires in with its own certificates — never template defaults.
#
# House rules in force:
#   - GitHub context reaches run: scripts only through env: indirection — ${{ }}
#     interpolated into a script is the classic Actions shell-injection vector.
#   - No third-party actions: rustup ships on every runner and pins the
#     toolchain itself; first-party actions/* follow verify.yml's tag pinning.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    # workflow_run fires on every completion; only a green verify packages.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run events GITHUB_SHA is main's tip at trigger time;
          # package exactly the commit whose verify succeeded.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The same pinned toolchain verify.yml uses — rustup itself is the pin,
      # no third-party action in the chain (NFR-11).
      - name: Install pinned rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install tauri linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libssl-dev
      # `tauri build` runs beforeBuildCommand (pnpm build) itself, then bundles
      # per-OS: .dmg/.app on macOS, .msi/.exe on Windows, .deb/.rpm/.AppImage on
      # Linux. The pinned @tauri-apps/cli devDependency does the work — never a
      # globally installed CLI.
      - name: tauri build (unsigned)
        run: pnpm exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
