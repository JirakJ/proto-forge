# The runtime edge of the image: an SPA fallback plus the SAME strict header set
# docs/SECURITY.md documents for the preview server — the deployed app enforces
# what the docs promise, it does not merely describe it.
#
# nginx constraint worth knowing before editing: add_header does NOT inherit into
# a block that declares any add_header of its own. Every location below therefore
# restates the full security set next to its cache policy — deduplicating them
# into the server block would silently drop the security headers from exactly the
# responses that set a Cache-Control. deploy/smoke.mjs asserts the set is present
# on /version.json, so a regression here fails the smoke, not a reader's memory.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Deploy provenance: never cached, so a rollout is observable the moment the
    # new pod answers. The smoke test compares gitSha against the release's.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Vite emits content-hashed filenames under /assets/ — a changed file is a
    # changed URL, so immutable is safe and correct.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback: client-side routes resolve to index.html; real files win.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
