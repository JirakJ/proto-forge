# @adr 006 - alembic wiring. The database URL is never written here: env.py
# reads DATABASE_URL from the environment (secrets travel by name).
[alembic]
script_location = alembic
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
