# @adr 001 - one pinned stack, configured from one validated source
# The environment enters HERE and only here: the four variables map onto the
# app.* keys AppProperties binds, and everything else derives from those keys.
app.port=${PORT:8080}
app.log-level=${LOG_LEVEL:info}
app.database-url=${DATABASE_URL:}
app.git-sha=${GIT_SHA:dev}

server.port=${app.port}
logging.level.root=${app.log-level}

# One engine: a served PostgreSQL (BR-12/§15 - no in-memory stand-in). Flyway owns
# the schema (append-only history, BR-24); hibernate only VALIDATES it, never edits.
spring.datasource.url=${app.database-url}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Problem responses are owned by app.platform.ProblemHandler (RFC 9457, BR-23).
spring.mvc.problemdetails.enabled=false
spring.jackson.default-property-inclusion=non_null
