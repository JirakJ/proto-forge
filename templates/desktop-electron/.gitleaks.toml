title = "proto-forge secret scan config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and example locale strings are not real secrets (BR-12)."
paths = [
  # Build outputs and the installed tree: gitleaks runs with --no-git, so a
  # local build/package run would otherwise feed high-entropy artifacts
  # (installers, the bundled binary) into the entropy rules. None of these
  # paths is committed.
  '''dist/.*''',
  '''dist-electron/.*''',
  '''release/.*''',
  '''node_modules/.*''',
  '''.*\.test\.(ts|tsx)$''',
  '''.*\.e2e\.ts$''',
  '''.*__fixtures__/.*''',
  '''src/i18n/locales/.*''',
]
