          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        if: >-
          endsWith(needs.plan.outputs.registry_host, '.azurecr.io') ||
          fromJson(needs.plan.outputs.plan).environments.prod.cluster.type == 'aks'
        with:
          client-id: ${{ secrets[fromJson(needs.plan.outputs.plan).environments.prod.auth.azureClientIdEnv] }}
          tenant-id: ${{ secrets[fromJson(needs.plan.outputs.plan).environments.prod.auth.azureTenantIdEnv] }}
          subscription-id: ${{ secrets[fromJson(needs.plan.outputs.plan).environments.prod.auth.azureSubscriptionIdEnv] }}
      - name: log in to ACR
        if: endsWith(needs.plan.outputs.registry_host, '.azurecr.io')
        env:
          REGISTRY: ${{ needs.plan.outputs.registry_host }}
        run: az acr login --name "${REGISTRY%%.*}"
      - name: resolve the image digest
        id: digest
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{ json .Manifest }}' | jq -r .digest)"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::no digest for $IMAGE:sha-$SHA — was this commit packaged?"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        if: needs.plan.outputs.sign == 'true'
      - name: cosign verify the workflow identity
        if: needs.plan.outputs.sign == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${REPO}/[.]github/workflows/package[.]yml@" \
            "$IMAGE@$DIGEST"
      - name: cluster login (aks)
        if: fromJson(needs.plan.outputs.plan).environments.prod.cluster.type == 'aks'
        env:
          CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
          RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
        run: |
          sudo az aks install-cli
          az aks get-credentials --name "$CLUSTER_NAME" --resource-group "$RESOURCE_GROUP"
          kubelogin convert-kubeconfig -l azurecli
      - name: cluster login (openshift)
        if: fromJson(needs.plan.outputs.plan).environments.prod.cluster.type == 'openshift'
        env:
          OC_TOKEN: ${{ secrets[fromJson(needs.plan.outputs.plan).environments.prod.auth.tokenEnv] }}
          SERVER: ${{ fromJson(needs.plan.outputs.plan).environments.prod.cluster.server }}
        run: |
          curl -sSfL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.17.9/openshift-client-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin oc
          oc login --token="$OC_TOKEN" --server="$SERVER"
      - name: cluster login (generic)
        if: fromJson(needs.plan.outputs.plan).environments.prod.cluster.type == 'generic'
        env:
          KUBECONFIG_CONTENT: ${{ secrets[fromJson(needs.plan.outputs.plan).environments.prod.auth.kubeconfigEnv] }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
