packages:
  - "packages/*"

# handlebars <4.7.9 carries the 2026 JS-injection advisory batch (GHSA-2w6w-674q-4c4q
# et al.), pulled dev-only via eslint-plugin-boundaries@5 → @boundaries/elements.
# Drop when eslint-plugin-boundaries is bumped to ≥7 (pins 4.7.9 itself).
overrides:
  zod: ^4.6.6
  handlebars: 4.7.10
  # Dev-only transitives flagged by osv-scanner (pnpm audit --prod does not see them):
  # brace-expansion GHSA-rgw5-rvv9-x895 (ReDoS), postcss GHSA-fxqj-rqcc-2cmp (arbitrary
  # .map read), undici GHSA-4cwx-7wf7-3272 (cache cross-user disclosure),
  # js-yaml GHSA-5p4m-2wfm-xmqj (HIGH, prototype pollution via the schema loader —
  # reaches us through eslint and jscpd config parsing), nanoid GHSA-2v37-7h3g-55p8
  # (HIGH, predictable ids from a non-uniform RNG — via vite/postcss asset naming).
  # Each pin is the first patched release in the range every dependent already accepts,
  # so nothing here forces a major bump on a dependent.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  postcss: ^8.5.23
  undici: ^7.30.1
  # fast-uri <3.1.6 / <4.1.3 carries four HIGH advisories: host confusion via
  # percent-encoded scheme normalization (GHSA-jqff-g426-hqxp) and via skipped IDN
  # canonicalization on scheme-relative references (GHSA-5jgf-p345-68v8), plus SSRF
  # via malformed IPv6 normalization (GHSA-f65p-4m7j-42xc) and repeated hostname
  # percent-decoding (GHSA-fph4-wmhf-6fwf). Dev-only, pulled through ajv@8.
  fast-uri@3: ^3.1.9
  # 4.3.2 also closes GHSA-2883-xcg3-v3hh (HIGH, maxTotalMergeKeys does not limit
  # CPU use for empty merge sources).
  js-yaml: ^4.3.2
  nanoid: ^3.3.17
  # qs GHSA-q8mj-m7cp-5q26 (MODERATE, arrayLimit bypass under allowDots) — dev-only,
  # via @stryker-mutator/core → typed-rest-client. Drop when typed-rest-client moves
  # its range past 6.15.1.
  # 6.16.0 additionally closes GHSA-4mjr-xmp4-gh2g (MODERATE, DoS via an
  # attacker-controlled isBuffer) and GHSA-x5fp-wj9c-mxmx (MODERATE, array-limit
  # bypass via bracket-key comma parsing).
  # 6.16.1 closes GHSA-6pq8-jhm2-2vcw (MODERATE, uncaught TypeError in stringify
  # with arrayFormat "comma").
  qs: ">=6.16.1"
  braces: file:vendor/braces-3.0.4-security.1.tgz

  # Security fixes for existing transitives; local sprintf fork includes tests.
  source-map-js: 1.2.2
  sprintf-js: file:vendor/sprintf-js-1.1.4-security.1.tgz
