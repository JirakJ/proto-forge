name: package

# ADR 202 / NFR-17: the stage that turns a green verify into a signed, scanned,
# pushed image. Everything network-touching lives HERE, never in verify. One
# image is built per commit and promoted, never rebuilt — cd.yml deploys the
# digest this workflow pushed.
#
# House rules in force:
#   - GitHub context reaches run: scripts only through env: indirection — ${{ }}
#     interpolated into a script is the classic Actions shell-injection vector.
#   - Third-party actions are pinned to full commit SHAs (version in a comment);
#     first-party actions/* follow verify.yml's tag pinning.
#   - Tools install pinned, the same pattern as verify.yml.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing + azure OIDC federation

jobs:
  package:
    runs-on: ubuntu-latest
    # workflow_run fires on every completion; only a green verify packages.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run events GITHUB_SHA is main's tip at trigger time;
          # build exactly the commit whose verify succeeded.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # deploy-cli reads .proto-forge/config.json with node stdlib only:
      # no install, no network, same plan an operator gets from `pnpm deploy:plan`.
      - name: plan
        id: plan
        run: node scripts/deploy-cli.mjs plan --github-output >> "$GITHUB_OUTPUT"

      - name: build image
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker buildx build --load \
            --build-arg GIT_SHA="$HEAD_SHA" \
            -t "$IMAGE:sha-$HEAD_SHA" .

      # NFR-30: the perf-smoke stage — coarse ceilings, published trend. Latency
      # micro-budgets on shared runners are noise (NFR-13's argument); what IS
      # signal: the image failing to boot, errors under sustained load, an
      # order-of-magnitude latency regression, or an image that doubled in size.
      # The driver is plain node (no install), the endpoints are the platform's
      # DB-free /healthz and /version, and the measured numbers land in the job
      # summary as the trend record. Gated by the committed config's
      # deployment.perfSmoke (surfaced by the plan step), so this workflow stays
      # byte-identical across frontend and backend (deploy:sync) while each
      # stack turns the stage on with one reviewed config line.
      - name: perf smoke
        if: steps.plan.outputs.perf == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PERF_LATENCY_BUDGET_MS: "1000"
          PERF_IMAGE_SIZE_BUDGET_MB: "400"
        run: |
          APP_PORT="$(docker image inspect --format '{{range $p, $x := .Config.ExposedPorts}}{{$p}}{{end}}' "$IMAGE:sha-$HEAD_SHA" | head -1 | cut -d/ -f1)"
          docker run -d --name perf-app -p "3000:${APP_PORT:-3000}" \
            -e DATABASE_URL=postgres://perf:perf@127.0.0.1:5432/app \
            -e LOG_LEVEL=warn "$IMAGE:sha-$HEAD_SHA"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz > /dev/null && break
            [ "$i" = 30 ] && { echo "app never became healthy"; docker logs perf-app; exit 1; }
            sleep 1
          done
          node --input-type=module - <<'PERF'
          const budget = Number(process.env.PERF_LATENCY_BUDGET_MS);
          const base = "http://127.0.0.1:3000";
          const paths = ["/healthz", "/version"];
          const lat = [];
          let errors = 0, non2xx = 0;
          const until = Date.now() + 15_000;
          const worker = async (n) => {
            while (Date.now() < until) {
              const t0 = performance.now();
              try {
                const res = await fetch(base + paths[n % paths.length]);
                if (!res.ok) non2xx += 1;
                await res.arrayBuffer();
              } catch { errors += 1; }
              lat.push(performance.now() - t0);
            }
          };
          await Promise.all(Array.from({ length: 25 }, (_, n) => worker(n)));
          lat.sort((a, b) => a - b);
          const pct = (p) => lat[Math.min(lat.length - 1, Math.floor((p / 100) * lat.length))] ?? 0;
          const p50 = pct(50), p95 = pct(95), p99 = pct(99);
          const rps = Math.round(lat.length / 15);
          const row = `| ${lat.length} | ${rps} | ${p50.toFixed(1)} | ${p95.toFixed(1)} | ${p99.toFixed(1)} | ${errors} | ${non2xx} |`;
          const fs = await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## perf smoke (15s, 25 workers, /healthz + /version)\n\n" +
            "| requests | req/s | p50 ms | p95 ms | p99 ms | errors | non-2xx |\n" +
            "| --- | --- | --- | --- | --- | --- | --- |\n" + row + "\n");
          console.log(row);
          if (errors > 0 || non2xx > 0) { console.error(`perf smoke: ${errors} errors, ${non2xx} non-2xx under load`); process.exit(1); }
          if (p95 > budget) { console.error(`perf smoke: p95 ${p95.toFixed(1)}ms exceeds the ${budget}ms coarse ceiling`); process.exit(1); }
          PERF
          MEM="$(docker stats --no-stream --format '{{.MemUsage}}' perf-app)"
          SIZE_B="$(docker image inspect --format '{{.Size}}' "$IMAGE:sha-$HEAD_SHA")"
          SIZE_MB=$(( SIZE_B / 1000000 ))
          echo "container memory right after the load: $MEM" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image size: ${SIZE_MB} MB (ceiling ${PERF_IMAGE_SIZE_BUDGET_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker rm -f perf-app
          if [ "$SIZE_MB" -gt "$PERF_IMAGE_SIZE_BUDGET_MB" ]; then
            echo "image size ${SIZE_MB} MB exceeds the ${PERF_IMAGE_SIZE_BUDGET_MB} MB ceiling — remove weight, never raise the number without an ADR"
            exit 1
          fi

      # trivy serves both the scan and the image SBOM; pinned install either way.
      - name: install trivy (pinned)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin trivy
      - name: scan image
        if: steps.plan.outputs.scan == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SEVERITY: ${{ steps.plan.outputs.severity }}
        # .trivyignore suppressions are triaged and expiring — deploy:verify
        # fails undated or expired entries before this scan ever honours them.
        run: |
          trivy image --severity "$SEVERITY" --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore "$IMAGE:sha-$HEAD_SHA"
      - name: image SBOM (CycloneDX)
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: trivy image --format cyclonedx --output image-sbom.cdx.json "$IMAGE:sha-$HEAD_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: image-sbom.cdx.json

      # Registry login: GHCR rides the workflow's own GITHUB_TOKEN; ACR rides
      # Azure OIDC federation — no long-lived registry password in either path.
      - name: log in to GHCR
        if: steps.plan.outputs.registry_host == 'ghcr.io'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        if: endsWith(steps.plan.outputs.registry_host, '.azurecr.io')
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: log in to ACR
        if: endsWith(steps.plan.outputs.registry_host, '.azurecr.io')
        env:
          REGISTRY: ${{ steps.plan.outputs.registry_host }}
        run: az acr login --name "${REGISTRY%%.*}"

      - name: push
        id: push
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:sha-$HEAD_SHA"
          if [ "$EVENT" = "push" ]; then
            docker tag "$IMAGE:sha-$HEAD_SHA" "$IMAGE:$REF_NAME"
            docker push "$IMAGE:$REF_NAME"
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$HEAD_SHA" --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signing binds the signature to THIS repository's package.yml
      # workflow identity via the runner's OIDC token — no key to store, rotate
      # or leak. cd.yml verifies exactly that identity before every rollout.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        if: steps.plan.outputs.sign == 'true'
      - name: cosign sign + attest the SBOM
        if: steps.plan.outputs.sign == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate image-sbom.cdx.json "$IMAGE@$DIGEST"
