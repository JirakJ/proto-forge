# A dedicated identity per release, with API access switched off: a static web
# server has no business talking to the Kubernetes API, and an unmounted token
# is one less credential in the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
automountServiceAccountToken: false
