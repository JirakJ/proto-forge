name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# Two jobs, deliberately separate: a plugin failure and a template failure have
# different causes and different fixes, and one combined red X hides which happened.
jobs:
  plugin:
    name: plugin gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: template/.nvmrc
      - name: selftest the gates
        run: node scripts/selftest-all.mjs
      - name: verify
        run: node scripts/citations.mjs && node scripts/skill-lint.mjs && node scripts/manifest-lint.mjs && node scripts/template-integrity.mjs

  template:
    name: template verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - name: install gitleaks
        # sec:scan hard-stops in CI when gitleaks is absent (NFR-08, BRS §4). A pinned
        # binary install is what makes that hard-stop meaningful rather than a permanent
        # failure — gitleaks-action is a scanner wrapper, not an installer.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: install
        # Warms the pnpm store and the Playwright browser cache the scratch copy will
        # reuse; node_modules itself is excluded from the copy.
        working-directory: template
        run: pnpm install --frozen-lockfile
      - name: install browsers
        working-directory: template
        run: pnpm exec playwright install --with-deps chromium
      - name: verify the shipped template in isolation
        # Copies template/ to a scratch dir, installs there and runs its own verify —
        # the standalone proof: the tree we ship works outside this repository.
        run: node scripts/verify-template.mjs
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .scratch/verify-template/playwright-report/
          retention-days: 7
