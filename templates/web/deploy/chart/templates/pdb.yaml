{{- if gt (int .Values.replicas) 1 }}
# Only meaningful with more than one replica: with a single pod, minAvailable 1
# would block every voluntary eviction (node drains included) forever.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
{{- end }}
