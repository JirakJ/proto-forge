name: verify

# The gates are the interface (BRS §17.3): CI is a thin wrapper that runs the
# same `pnpm verify` you run locally. Porting to any runner = re-expressing these
# steps. If `pnpm verify` is green locally, it is green here — plus the two
# CI-only tiers: the Testcontainers integration suite runs inside test:unit
# (Docker is present here, so the tool-gate opens) and the Tier-2 native gate
# selftests prove the python toolchain's gates fire.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the prompt-log step below diffs against the branch base.
          fetch-depth: 0
      # BR-13 / NFR-10 / ADR 002: .prompts/ is append-only. The local hook enforces it
      # per edit; this is the same promise where hooks do not run. Corrections are NEW
      # entries referencing the prior id, never rewrites. (A force-push can still evade
      # a history diff — protect the default branch to close that door.)
      - name: prompt log is append-only
        # GitHub context reaches the shell only through env, never by ${{ }} inside
        # run: interpolating a ref name into the script is the classic Actions
        # shell-injection vector.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            case "$BEFORE_SHA" in ""|0000000000000000000000000000000000000000) echo "no prior commit to compare against"; exit 0;; esac
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || { echo "prior commit unreachable after a force-push — relying on branch protection"; exit 0; }
            range="${BEFORE_SHA}..HEAD"
          fi
          changed="$(git diff --diff-filter=MD --name-only "$range" -- .prompts/)"
          if [ -n "$changed" ]; then
            echo "::error::.prompts/ is append-only (ADR 002) — these entries were rewritten or deleted:"
            echo "$changed"
            exit 1
          fi
          echo "prompt log untouched in $range"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The pinned python toolchain (NFR-11): uv version pinned, python from
      # .python-version, install strictly from the committed lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen
      # deploy:verify's toolchain, same doctrine: tool-gated locally, mandatory
      # here. docker and helm already ship on ubuntu-latest; hadolint and
      # kubeconform are installed pinned.
      - name: Install hadolint
        run: |
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - run: pnpm verify
      # Tier 2 (BRS §18/§19): real throwaway uv projects proving the NATIVE gates
      # fire — import-linter, the pytest coverage floor, alembic check. CI-only:
      # they need the toolchain (and Docker for alembic) that fixture selftests
      # deliberately do without.
      - run: pnpm run gates:selftest:native
      # BR-36: the measured quality facts, visible on the run page. --summary
      # renders .proto-forge/quality.json as markdown; GITHUB_STEP_SUMMARY is a
      # runner-provided path, referenced only through the environment (no ${{ }}
      # interpolation — the same shell-injection hygiene as the prompt-log step).
      - name: quality summary
        if: always()
        run: node scripts/quality-report.mjs --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-forge-artifacts
          path: |
            .proto-forge/snapshot.json
            .proto-forge/sbom.cdx.json
            .proto-forge/quality.json
          if-no-files-found: ignore
