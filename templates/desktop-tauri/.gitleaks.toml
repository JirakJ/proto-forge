title = "proto-forge secret scan config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and example locale strings are not real secrets (BR-12)."
paths = [
  # Build outputs and the installed tree: gitleaks runs with --no-git, so a
  # local cargo/vite build would otherwise feed high-entropy artifacts (e.g.
  # .rmeta) into the entropy rules. None of these paths is committed.
  '''src-tauri/target/.*''',
  '''dist/.*''',
  '''node_modules/.*''',
  '''.*\.test\.(ts|tsx)$''',
  '''.*\.e2e\.ts$''',
  '''.*__fixtures__/.*''',
  '''src/i18n/locales/.*''',
]
