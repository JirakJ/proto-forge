name: verify

# The gates are the interface (BRS §17.3): CI is a thin wrapper that runs the
# same `pnpm verify` you run locally, plus the two Docker-gated tiers a laptop
# may not carry (the real-database tests and the native gate selftests). If
# `pnpm verify` is green locally, the verify step is green here.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the prompt-log step below diffs against the branch base.
          fetch-depth: 0
      # BR-13 / NFR-10 / ADR 002: .prompts/ is append-only. The local hook enforces it
      # per edit; this is the same promise where hooks do not run. Corrections are NEW
      # entries referencing the prior id, never rewrites. (A force-push can still evade
      # a history diff — protect the default branch to close that door.)
      - name: prompt log is append-only
        # GitHub context reaches the shell only through env, never by ${{ }} inside
        # run: interpolating a ref name into the script is the classic Actions
        # shell-injection vector.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          else
            case "$BEFORE_SHA" in ""|0000000000000000000000000000000000000000) echo "no prior commit to compare against"; exit 0;; esac
            git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || { echo "prior commit unreachable after a force-push — relying on branch protection"; exit 0; }
            range="${BEFORE_SHA}..HEAD"
          fi
          changed="$(git diff --diff-filter=MD --name-only "$range" -- .prompts/)"
          if [ -n "$changed" ]; then
            echo "::error::.prompts/ is append-only (ADR 002) — these entries were rewritten or deleted:"
            echo "$changed"
            exit 1
          fi
          echo "prompt log untouched in $range"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Gradle cache + wrapper validation: the wrapper is checksum-pinned in
      # gradle-wrapper.properties (NFR-11); setup-gradle caches ~/.gradle and
      # validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # gitleaks and osv-scanner are external binaries; install pinned builds so
      # sec:scan enforces both (BRS §4/§16 hard-stops).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Install osv-scanner
        run: |
          sudo curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          sudo chmod +x /usr/local/bin/osv-scanner
      # Locked resolution: a coordinate gradle.lockfile does not name fails here
      # rather than resolving something new (NFR-11).
      - run: pnpm verify
      # The Docker-gated tiers (ADR 003/006): the real-database persistence tests
      # and the Tier-2 native gate selftests are tool-gated on a laptop, mandatory here.
      - run: ./gradlew nativeTest --console=plain
      - run: pnpm gates:selftest:native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-forge-artifacts
          path: |
            .proto-forge/snapshot.json
            .proto-forge/sbom.cdx.json
            build/reports/jacoco
            build/reports/pitest
          if-no-files-found: ignore
